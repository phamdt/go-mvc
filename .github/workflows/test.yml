name: Go

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  build:
    name: Build
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:

    - name: Check out code into the Go module directory
      uses: actions/checkout@v4

    - name: Set up Go 1.26.11
      uses: actions/setup-go@v5
      with:
        go-version: "1.26.11"
      id: go

    - name: Build
      run: go build -v .

    - name: Test
      run: go test -v ./...

    - name: Build all packages
      run: go build ./...